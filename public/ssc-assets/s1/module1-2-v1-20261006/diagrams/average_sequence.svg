<svg xmlns="http://www.w3.org/2000/svg" width="700" height="590" viewBox="0 0 700 590" role="img" aria-labelledby="title desc">
<title id="title">Sequence flowchart: average three values</title><desc id="desc">Flowchart with labeled standard flowchart symbols and directed arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263746"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172b3a}.edge-label{font-size:16px;font-weight:bold}.terminal{fill:#e5f2ff;stroke:#1769aa;stroke-width:2.5}.io{fill:#e8f6ed;stroke:#287a45;stroke-width:2.5}.process{fill:#fff5d8;stroke:#9a6a00;stroke-width:2.5}.decision{fill:#f7e9ff;stroke:#75449a;stroke-width:2.5}.arrow{fill:none;stroke:#263746;stroke-width:2.5}</style>
<path d="M 350 97 L 350 140" class="arrow" marker-end="url(#arrow)"/><path d="M 350 212 L 350 255" class="arrow" marker-end="url(#arrow)"/><path d="M 350 327 L 350 370" class="arrow" marker-end="url(#arrow)"/><path d="M 350 442 L 350 485" class="arrow" marker-end="url(#arrow)"/><rect x="205" y="25" width="290" height="72" rx="36" class="terminal"/><text x="350" y="61" text-anchor="middle"><tspan x="350" dy="0">START</tspan></text><polygon points="233,140 495,140 467,212 205,212" class="io"/><text x="350" y="176" text-anchor="middle"><tspan x="350" dy="0">Input a, b, c</tspan></text><rect x="205" y="255" width="290" height="72" class="process"/><text x="350" y="291" text-anchor="middle"><tspan x="350" dy="0">avg = (a + b + c) / 3</tspan></text><polygon points="233,370 495,370 467,442 205,442" class="io"/><text x="350" y="406" text-anchor="middle"><tspan x="350" dy="0">Print avg</tspan></text><rect x="205" y="485" width="290" height="72" rx="36" class="terminal"/><text x="350" y="521" text-anchor="middle"><tspan x="350" dy="0">STOP</tspan></text></svg>