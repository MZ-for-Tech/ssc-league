<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title desc"><title id="title">Pre-test and post-test loop flowcharts</title><desc id="desc">Two flowcharts compare a condition before the process with a condition after the process.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#263746"/></marker></defs><style>text{font:18px Arial;fill:#172b3a}.head{font-weight:bold;font-size:23px}.t{fill:#e5f2ff;stroke:#1769aa;stroke-width:3}.p{fill:#fff5d8;stroke:#9a6a00;stroke-width:3}.d{fill:#f7e9ff;stroke:#75449a;stroke-width:3}.a{fill:none;stroke:#263746;stroke-width:3;marker-end:url(#a)}.lab{font-size:16px;font-weight:bold}</style><text class="head" x="240" y="42" text-anchor="middle">Pre-test</text><text class="head" x="720" y="42" text-anchor="middle">Post-test</text><rect class="t" x="155" y="70" width="170" height="58" rx="29"/><text x="240" y="106" text-anchor="middle">START</text><polygon class="d" points="240,165 345,215 240,265 135,215"/><text x="240" y="221" text-anchor="middle">Condition?</text><rect class="p" x="155" y="335" width="170" height="70"/><text x="240" y="377" text-anchor="middle">Process step</text><rect class="t" x="155" y="520" width="170" height="58" rx="29"/><text x="240" y="556" text-anchor="middle">STOP</text><path class="a" d="M240 128L240 165"/><path class="a" d="M240 265L240 335"/><text class="lab" x="250" y="302">Yes</text><path class="a" d="M135 215L90 215L90 550L155 550"/><text class="lab" x="98" y="202">No</text><path class="a" d="M325 370L385 370L385 215L345 215"/><text class="lab" x="350" y="350">repeat</text><rect class="t" x="635" y="70" width="170" height="58" rx="29"/><text x="720" y="106" text-anchor="middle">START</text><rect class="p" x="635" y="185" width="170" height="70"/><text x="720" y="227" text-anchor="middle">Process step</text><polygon class="d" points="720,315 825,365 720,415 615,365"/><text x="720" y="371" text-anchor="middle">Condition?</text><rect class="t" x="635" y="535" width="170" height="58" rx="29"/><text x="720" y="571" text-anchor="middle">STOP</text><path class="a" d="M720 128L720 185"/><path class="a" d="M720 255L720 315"/><path class="a" d="M615 365L565 365L565 220L635 220"/><text class="lab" x="570" y="350">Yes</text><path class="a" d="M720 415L720 535"/><text class="lab" x="732" y="480">No</text></svg>