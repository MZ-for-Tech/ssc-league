<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">On-page and off-page flowchart connectors</title><desc id="desc">Matching A off-page symbols continue a chart from page one to page two. Two matching B circles connect separated parts on page one.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#263746"/></marker></defs><style>text{font:18px Arial;fill:#172b3a}.head{font-weight:bold;font-size:22px}.t{fill:#e5f2ff;stroke:#1769aa;stroke-width:3}.p{fill:#fff5d8;stroke:#9a6a00;stroke-width:3}.io{fill:#e8f6ed;stroke:#287a45;stroke-width:3}.off{fill:#fce9e9;stroke:#aa3333;stroke-width:3}.on{fill:#f7e9ff;stroke:#75449a;stroke-width:3}.a{fill:none;stroke:#263746;stroke-width:3;marker-end:url(#a)}</style><rect x="15" y="15" width="420" height="525" fill="none" stroke="#8899a6" stroke-dasharray="8 7"/><rect x="465" y="15" width="420" height="525" fill="none" stroke="#8899a6" stroke-dasharray="8 7"/><text class="head" x="225" y="48" text-anchor="middle">Page 1</text><text class="head" x="675" y="48" text-anchor="middle">Page 2</text><rect class="t" x="130" y="75" width="190" height="58" rx="29"/><text x="225" y="111" text-anchor="middle">START</text><polygon class="io" points="150,175 320,175 300,235 130,235"/><text x="225" y="211" text-anchor="middle">Input value</text><path class="a" d="M225 133L225 175"/><path class="a" d="M225 235L225 285"/><path class="off" d="M165 285H285V330L225 370L165 330Z"/><text x="225" y="324" text-anchor="middle">A</text><text x="225" y="393" text-anchor="middle">Off-page</text><path class="off" d="M615 75H735V120L675 160L615 120Z"/><text x="675" y="114" text-anchor="middle">A</text><path class="a" d="M675 160L675 190"/><rect class="p" x="590" y="190" width="170" height="75"/><text x="675" y="235" text-anchor="middle">Process step</text><path class="a" d="M675 265L675 320"/><rect class="t" x="590" y="320" width="170" height="58" rx="29"/><text x="675" y="356" text-anchor="middle">STOP</text><circle class="on" cx="120" cy="465" r="28"/><text x="120" y="472" text-anchor="middle">B</text><circle class="on" cx="330" cy="465" r="28"/><text x="330" y="472" text-anchor="middle">B</text><text x="225" y="425" text-anchor="middle">Two matching on-page connectors</text><path class="a" d="M50 465L92 465"/><path class="a" d="M358 465L405 465"/><text x="225" y="520" text-anchor="middle">Same-page chart parts join at matching B circles</text><text x="675" y="435" text-anchor="middle">A continues from Page 1</text></svg>