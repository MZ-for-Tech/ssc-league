<svg xmlns="http://www.w3.org/2000/svg" width="700" height="860" viewBox="0 0 700 860" role="img" aria-labelledby="title desc">
<title id="title">Pre-test loop flowchart: sum integers from 1 to 100</title><desc id="desc">Flowchart with labeled standard flowchart symbols and directed arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263746"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172b3a}.edge-label{font-size:16px;font-weight:bold}.terminal{fill:#e5f2ff;stroke:#1769aa;stroke-width:2.5}.io{fill:#e8f6ed;stroke:#287a45;stroke-width:2.5}.process{fill:#fff5d8;stroke:#9a6a00;stroke-width:2.5}.decision{fill:#f7e9ff;stroke:#75449a;stroke-width:2.5}.arrow{fill:none;stroke:#263746;stroke-width:2.5}</style>
<path d="M 350 92 L 350 120" class="arrow" marker-end="url(#arrow)"/><path d="M 350 192 L 350 230" class="arrow" marker-end="url(#arrow)"/><path d="M 350 302 L 350 410" class="arrow" marker-end="url(#arrow)"/><text class="edge-label" x="364" y="350.0">Yes</text><path d="M 350 482 L 350 520" class="arrow" marker-end="url(#arrow)"/><path d="M 495 556 L 610 556 L 610 266 L 495 266" class="arrow" marker-end="url(#arrow)"/><path d="M 495 266 L 550 266 L 550 650 L 510 650" class="arrow" marker-end="url(#arrow)"/><text class="edge-label" x="555" y="470.0">No</text><path d="M 510 722 L 510 755" class="arrow" marker-end="url(#arrow)"/><rect x="205" y="20" width="290" height="72" rx="36" class="terminal"/><text x="350" y="56" text-anchor="middle"><tspan x="350" dy="0">START</tspan></text><rect x="205" y="120" width="290" height="72" class="process"/><text x="350" y="156" text-anchor="middle"><tspan x="350" dy="0">Sum = 0; N = 1</tspan></text><polygon points="350,230 495,288 350,346 205,288" class="decision"/><text x="350" y="270" text-anchor="middle"><tspan x="350" dy="0">N &lt;= 100?</tspan></text><rect x="205" y="410" width="290" height="72" class="process"/><text x="350" y="446" text-anchor="middle"><tspan x="350" dy="0">Sum = Sum + N</tspan></text><rect x="205" y="520" width="290" height="72" class="process"/><text x="350" y="556" text-anchor="middle"><tspan x="350" dy="0">N = N + 1</tspan></text><polygon points="393,650 655,650 627,722 365,722" class="io"/><text x="510" y="686" text-anchor="middle"><tspan x="510" dy="0">Print Sum</tspan></text><rect x="365" y="755" width="290" height="72" rx="36" class="terminal"/><text x="510" y="791" text-anchor="middle"><tspan x="510" dy="0">STOP</tspan></text></svg>