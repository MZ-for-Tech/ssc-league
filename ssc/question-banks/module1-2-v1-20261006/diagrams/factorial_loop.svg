<svg xmlns="http://www.w3.org/2000/svg" width="700" height="960" viewBox="0 0 700 960" role="img" aria-labelledby="title desc">
<title id="title">Pre-test loop flowchart: factorial of positive N</title><desc id="desc">Flowchart with labeled standard flowchart symbols and directed arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263746"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172b3a}.edge-label{font-size:16px;font-weight:bold}.terminal{fill:#e5f2ff;stroke:#1769aa;stroke-width:2.5}.io{fill:#e8f6ed;stroke:#287a45;stroke-width:2.5}.process{fill:#fff5d8;stroke:#9a6a00;stroke-width:2.5}.decision{fill:#f7e9ff;stroke:#75449a;stroke-width:2.5}.arrow{fill:none;stroke:#263746;stroke-width:2.5}</style>
<path d="M 350 92 L 350 115" class="arrow" marker-end="url(#arrow)"/><path d="M 350 187 L 350 210" class="arrow" marker-end="url(#arrow)"/><path d="M 350 282 L 350 320" class="arrow" marker-end="url(#arrow)"/><path d="M 350 392 L 350 500" class="arrow" marker-end="url(#arrow)"/><text class="edge-label" x="364" y="440.0">Yes</text><path d="M 350 572 L 350 610" class="arrow" marker-end="url(#arrow)"/><path d="M 495 646 L 610 646 L 610 356 L 495 356" class="arrow" marker-end="url(#arrow)"/><path d="M 495 356 L 550 356 L 550 755 L 510 755" class="arrow" marker-end="url(#arrow)"/><text class="edge-label" x="555" y="567.5">No</text><path d="M 510 827 L 510 860" class="arrow" marker-end="url(#arrow)"/><rect x="205" y="20" width="290" height="72" rx="36" class="terminal"/><text x="350" y="56" text-anchor="middle"><tspan x="350" dy="0">START</tspan></text><polygon points="233,115 495,115 467,187 205,187" class="io"/><text x="350" y="151" text-anchor="middle"><tspan x="350" dy="0">Input N</tspan></text><rect x="205" y="210" width="290" height="72" class="process"/><text x="350" y="246" text-anchor="middle"><tspan x="350" dy="0">I = 0; PROD = 1</tspan></text><polygon points="350,320 495,378 350,436 205,378" class="decision"/><text x="350" y="360" text-anchor="middle"><tspan x="350" dy="0">I &lt; N?</tspan></text><rect x="205" y="500" width="290" height="72" class="process"/><text x="350" y="536" text-anchor="middle"><tspan x="350" dy="0">I = I + 1</tspan></text><rect x="205" y="610" width="290" height="72" class="process"/><text x="350" y="646" text-anchor="middle"><tspan x="350" dy="0">PROD = PROD x I</tspan></text><polygon points="393,755 655,755 627,827 365,827" class="io"/><text x="510" y="791" text-anchor="middle"><tspan x="510" dy="0">Print PROD</tspan></text><rect x="365" y="860" width="290" height="72" rx="36" class="terminal"/><text x="510" y="896" text-anchor="middle"><tspan x="510" dy="0">STOP</tspan></text></svg>