<svg xmlns="http://www.w3.org/2000/svg" width="700" height="830" viewBox="0 0 700 830" role="img" aria-labelledby="title desc">
<title id="title">Decision flowchart: pass at average 60 or higher</title><desc id="desc">Flowchart with labeled standard flowchart symbols and directed arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263746"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172b3a}.edge-label{font-size:16px;font-weight:bold}.terminal{fill:#e5f2ff;stroke:#1769aa;stroke-width:2.5}.io{fill:#e8f6ed;stroke:#287a45;stroke-width:2.5}.process{fill:#fff5d8;stroke:#9a6a00;stroke-width:2.5}.decision{fill:#f7e9ff;stroke:#75449a;stroke-width:2.5}.arrow{fill:none;stroke:#263746;stroke-width:2.5}</style>
<path d="M 350 92 L 350 120" class="arrow" marker-end="url(#arrow)"/><path d="M 350 192 L 350 230" class="arrow" marker-end="url(#arrow)"/><path d="M 350 302 L 350 370" class="arrow" marker-end="url(#arrow)"/><path d="M 205 406 L 150 406 L 150 570 L 190 570" class="arrow" marker-end="url(#arrow)"/><text class="edge-label" x="80" y="500.0">Yes</text><path d="M 495 406 L 550 406 L 550 570 L 510 570" class="arrow" marker-end="url(#arrow)"/><text class="edge-label" x="555" y="500.0">No</text><path d="M 190 642 L 350 730" class="arrow" marker-end="url(#arrow)"/><path d="M 510 642 L 350 730" class="arrow" marker-end="url(#arrow)"/><rect x="205" y="20" width="290" height="72" rx="36" class="terminal"/><text x="350" y="56" text-anchor="middle"><tspan x="350" dy="0">START</tspan></text><polygon points="233,120 495,120 467,192 205,192" class="io"/><text x="350" y="156" text-anchor="middle"><tspan x="350" dy="0">Input four marks</tspan></text><rect x="205" y="230" width="290" height="72" class="process"/><text x="350" y="266" text-anchor="middle"><tspan x="350" dy="0">Avg = (Mark1 + Mark2 + Mark3 + Mark4) / 4</tspan></text><polygon points="350,370 495,428 350,486 205,428" class="decision"/><text x="350" y="410" text-anchor="middle"><tspan x="350" dy="0">Avg &gt;= 60?</tspan></text><polygon points="73,570 335,570 307,642 45,642" class="io"/><text x="190" y="606" text-anchor="middle"><tspan x="190" dy="0">Print Pass</tspan></text><polygon points="393,570 655,570 627,642 365,642" class="io"/><text x="510" y="606" text-anchor="middle"><tspan x="510" dy="0">Print Fail</tspan></text><rect x="205" y="730" width="290" height="72" rx="36" class="terminal"/><text x="350" y="766" text-anchor="middle"><tspan x="350" dy="0">STOP</tspan></text></svg>