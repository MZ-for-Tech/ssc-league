<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" role="img" aria-labelledby="title desc">
<title id="title">Incomplete flowchart without an ending terminal</title><desc id="desc">Flowchart with labeled standard flowchart symbols and directed arrows.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#263746"/></marker></defs>
<style>text{font-family:Arial,sans-serif;font-size:18px;fill:#172b3a}.edge-label{font-size:16px;font-weight:bold}.terminal{fill:#e5f2ff;stroke:#1769aa;stroke-width:2.5}.io{fill:#e8f6ed;stroke:#287a45;stroke-width:2.5}.process{fill:#fff5d8;stroke:#9a6a00;stroke-width:2.5}.decision{fill:#f7e9ff;stroke:#75449a;stroke-width:2.5}.arrow{fill:none;stroke:#263746;stroke-width:2.5}</style>
<path d="M 350 97 L 350 145" class="arrow" marker-end="url(#arrow)"/><path d="M 350 217 L 350 265" class="arrow" marker-end="url(#arrow)"/><path d="M 350 337 L 350 385" class="arrow" marker-end="url(#arrow)"/><rect x="205" y="25" width="290" height="72" rx="36" class="terminal"/><text x="350" y="61" text-anchor="middle"><tspan x="350" dy="0">START</tspan></text><polygon points="233,145 495,145 467,217 205,217" class="io"/><text x="350" y="181" text-anchor="middle"><tspan x="350" dy="0">Input value</tspan></text><rect x="205" y="265" width="290" height="72" class="process"/><text x="350" y="301" text-anchor="middle"><tspan x="350" dy="0">Calculate result</tspan></text><polygon points="233,385 495,385 467,457 205,457" class="io"/><text x="350" y="421" text-anchor="middle"><tspan x="350" dy="0">Print result</tspan></text></svg>