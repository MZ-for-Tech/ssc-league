<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1540" viewBox="0 0 700 1540" role="img" aria-labelledby="title desc">
<title id="title">Sequence flowchart: add six test scores</title><desc id="desc">Flowchart with labeled standard flowchart symbols and directed arrows.</desc>
